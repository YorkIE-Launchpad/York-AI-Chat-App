name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    # windows-latest → VS 2026 (v18); node-gyp < 12.1 cannot detect it
    # (nodejs/node-gyp#3282). Pin until project node-gyp is ≥ 12.1.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        run: npm ci

      - name: Download Node binaries
        run: node scripts/download-node.js

      - name: Build WSL agent
        run: npm run build:wsl-agent

      - name: Build MCP servers
        run: npm run build:mcp

      - name: TypeScript compile
        run: npx tsc

      - name: Vite build
        run: npx vite build

      # Writes repo secret ENV_PROD → .env.prod (gitignored). Public config only —
      # stage-env-prod rejects SECRET / API_KEY / TOKEN keys. Falls back to
      # .env.prod.example if the secret is unset.
      - name: Write production env
        shell: pwsh
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENV_PROD)) {
            Write-Host "::warning::Secret ENV_PROD is not set — staging will use .env.prod.example"
            exit 0
          }
          Set-Content -Path .env.prod -Value $env:ENV_PROD -NoNewline -Encoding utf8
          Write-Host "Wrote .env.prod from secret ENV_PROD"

      - name: Stage production env
        run: npm run stage:env-prod

      - name: Electron Builder
        run: npx electron-builder --win nsis --publish never

      # Verify critical resources are present in the packaged app
      - name: Smoke test - verify packaged resources
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            Write-Host "::warning::win-unpacked directory not found, skipping resource check"
            exit 0
          }

          $resourcesDir = Join-Path $unpackedDir "resources"
          Write-Host "Checking resources in: $resourcesDir"

          $checks = @(
            "mcp\gui-operate-server.js",
            "mcp\software-dev-server-example.js",
            "node\node.exe",
            "wsl-agent\index.js",
            "skills"
          )

          $failed = $false
          foreach ($check in $checks) {
            $fullPath = Join-Path $resourcesDir $check
            if (Test-Path $fullPath) {
              Write-Host "  OK: $check"
            } else {
              Write-Host "::error::Missing resource: $check"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Host "::error::Packaged app is missing critical resources"
            exit 1
          }
          Write-Host "All packaged resources verified."

      - name: Smoke test - launch app
        shell: pwsh
        run: |
          $unpackedDir = "release\win-unpacked"
          $exe = Get-ChildItem -Path $unpackedDir -Filter "*.exe" | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::No exe found in win-unpacked"
            exit 1
          }
          Write-Host "Launching: $($exe.FullName) --smoke-test"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill($true)
            Write-Host "::error::Launch smoke test timed out after 30s"
            exit 1
          }
          if ($proc.ExitCode -eq 0) {
            Write-Host "Launch smoke test passed"
          } else {
            Write-Host "::error::Launch smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }

      - name: Upload Windows installer (Actions artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-nsis
          path: release/*.exe
          retention-days: 14
          if-no-files-found: error

      # Same bucket/layout as local macOS `npm run upload:s3` / `build:s3`.
      # Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          YORK_S3_SKIP_TAG: '1'
        run: npm run upload:s3
